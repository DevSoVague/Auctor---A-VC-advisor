# Same database as the team repo's docker-compose.yml (pgvector on pg16, host port 5433,
# frontier/frontier), under its own project name so it never clashes with the team checkout.
name: evidence-store

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evidence-store-db
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
