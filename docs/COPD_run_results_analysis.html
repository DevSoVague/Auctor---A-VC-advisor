of Dual Phosphodiesterase 3 and 4 Inhibitor Ensifentrine on Exacerbation Rate and Risk in Patients With Moderate to Severe COPD.", "date": "2024-08-27", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/39197510/"}, {"id": "pmid:41031389", "title": "Phase 2a, Randomized Trial of Mitiperstat Versus Placebo in Patients with COPD at High Risk of Exacerbation (CRESCENDO).", "date": "2025-09-24", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/41031389/"}, {"id": "pmid:38981765", "title": "Long-term inhaled corticosteroid treatment in patients with chronic obstructive pulmonary disease, cardiovascular disease, and a recent hospitalised exacerbation: The ICSLIFE pragmatic, randomised controlled study.", "date": "2024-07-08", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/38981765/"}], "cards": [{"card": {"id": "h2", "mechanism": "Dual PDE3/4 inhibition with ensifentrine for symptomatic COPD", "target_ids": ["hgnc:PDE3A", "hgnc:PDE4B", "hgnc:PDE4D"], "direction": "inhibit", "evidence_tier": 1, "validation_level": "gold", "modality": "small molecule (nebulized)", "tractability": "Ensifentrine is a dual PDE3/4 inhibitor with positive phase 3 ENHANCE trials; roflumilast (PDE4) is approved; nebulized delivery limits systemic exposure.", "safety_clues": ["GI intolerance and weight loss for PDE4B; emesis for PDE4D; cardiac inotropy for PDE3A with systemic exposure (fx:ot-2020-11)."], "biggest_uncertainty": "Positioning vs LAMA/LABA and ICS; long-term adherence to nebulized therapy; potential cardiac effects if systemic exposure occurs.", "rationale_other_conditions": "PDE4 inhibition is used in COPD (roflumilast) and asthma; PDE3 inhibition adds bronchodilation.", "claims": [{"id": "a2-h2-001", "agent": "a2_mechanism", "text": "ENHANCE phase 3 trials (2023) enrolled patients with FEV1 30-70%, mMRC>=2, not on dual/triple therapy, and showed ensifentrine improved lung function and symptoms (source: pmid:37364283).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:37364283"]}, {"id": "a2-h2-002", "agent": "a2_mechanism", "text": "Pooled analysis of ENHANCE (2024) showed ensifentrine improved dyspnea (source: pmid:39106052).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:39106052"]}, {"id": "a2-h2-003", "agent": "a2_mechanism", "text": "Pooled analysis (2024) showed ensifentrine reduced exacerbation rate and risk in moderate-to-severe COPD (source: pmid:39197510).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:39197510"]}]}, "grade": {"tier": 1, "level": "gold", "lines": 2, "genetic": 0.2, "phase_in_disease": 4, "human_docs": 0, "failed_precedent": [], "reject": null, "rank": 1, "pub_count": 387}, "profile": {"hypothesis_id": "h2", "soc_gap_at_launch": "At launch (~2031-2033), standard of care will include LAMA/LABA and ICS/LAMA/LABA triple therapy (e.g., Anoro, Trelegy, Stiolto), the BID nebulized dual PDE3/4 inhibitor ensifentrine (approved 2024), and biologic add-ons for eosinophilic COPD (dupilumab; possibly tozorakimab, lunsekimig, or felcorekibart if approved). The gap is a once-daily, DPI-based dual PDE3/4 inhibitor that provides bronchodilation and anti-inflammatory effects with better adherence than BID nebulized ensifentrine, better tolerability than oral roflumilast (GI/weight loss), and can be combined with LAMA/LABA in a single inhaler. No such product is in development; current PDE3/4 inhibitors are either nebulized BID or oral with systemic side effects.", "minimum_specs": ["Efficacy: Non-inferior to ensifentrine on FEV1 AUC0-12h (within 50 mL) and at least 30% reduction in annualized moderate/severe exacerbations vs placebo on top of LAMA/LABA in symptomatic COPD (FEV1 30-70% predicted, mMRC\u22652).", "Safety: No increase in GI events (diarrhea, nausea) or weight loss vs placebo; no cardiac safety signal (no significant change in heart rate or QT interval).", "Dosing: Once-daily via DPI (not BID nebulized).", "Route: Inhaled, dry powder.", "Population: Moderate-to-severe COPD patients with symptoms and exacerbation risk, regardless of eosinophil count."], "holy_grail_specs": ["Efficacy: Superior to LAMA/LABA alone on exacerbation reduction (\u226540% reduction) and clinically meaningful improvements in dyspnea (TDI \u22651 unit) and lung function (trough FEV1 \u2265100 mL vs placebo).", "Safety: Placebo-level GI and cardiac safety; no weight loss; no pneumonia signal.", "Dosing: Once-daily DPI, fixed-dose combination with LAMA/LABA (single inhaler).", "Route: Inhaled, dry powder.", "Population: All symptomatic COPD, including chronic bronchitis phenotype and non-eosinophilic patients; also effective in patients with frequent exacerbations despite triple therapy."], "must_haves": ["Once-daily dosing via DPI (vs BID nebulized ensifentrine) with non-inferior trough FEV1 (within 50 mL) to ensifentrine.", "\u226530% reduction in annualized moderate/severe exacerbations vs placebo on top of LAMA/LABA in patients with FEV1 30-70% predicted and mMRC\u22652."], "expansion_opportunity": "After first approval in moderate-to-severe COPD, expand to: (1) COPD with chronic bronchitis phenotype (roflumilast niche but with better tolerability and once-daily DPI), (2) asthma (PDE4 inhibition is approved for asthma; PDE3 adds bronchodilation), (3) COPD patients with frequent exacerbations despite triple therapy (add-on to ICS/LAMA/LABA), and (4) potentially bronchiectasis or other neutrophilic airway diseases given PDE4 anti-inflammatory effects. Mechanistic rationale: dual PDE3/4 inhibition provides both bronchodilation (PDE3) and anti-inflammatory activity (PDE4) independent of eosinophilic status, making it broadly applicable across COPD phenotypes.", "claims": [{"id": "a3-h2-001", "agent": "a3_profile", "text": "Ensifentrine is a dual PDE3/4 inhibitor approved for COPD as a BID nebulized therapy (2024) (pmid:41409630, 2025).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:41409630"]}, {"id": "a3-h2-002", "agent": "a3_profile", "text": "In ENHANCE trials, ensifentrine improved FEV1 AUC0-12h by 87-94 mL vs placebo and reduced exacerbation rate by ~44% (RR 0.56) (pmid:37364283, 2023; pmid:39197510, 2024).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:37364283", "pmid:39197510"]}, {"id": "a3-h2-003", "agent": "a3_profile", "text": "Ensifentrine improved dyspnea (TDI) vs placebo in pooled ENHANCE analysis (pmid:39106052, 2024).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:39106052"]}, {"id": "a3-h2-004", "agent": "a3_profile", "text": "Roflumilast, an oral PDE4 inhibitor, is limited to severe COPD with chronic bronchitis and reduces exacerbations by only 15-18%, with weight loss (7.5% vs 2.1%) and GI side effects (fda:NDA022522, 2025; market:drug:roflumilast, 2023).", "kind": "evidence", "confidence": 0.9, "source_ids": ["fda:NDA022522", "market:drug:roflumilast:2023-01-01"]}, {"id": "a3-h2-005", "agent": "a3_profile", "text": "Dupilumab is approved for COPD with blood eosinophils \u2265300/\u03bcL, reducing exacerbations vs placebo on top of triple therapy (pmid:37272521, 2023).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:37272521"]}, {"id": "a3-h2-006", "agent": "a3_profile", "text": "Several biologic programs for COPD have failed or are uncertain: benralizumab (RESOLUTE missed primary endpoint, shelved 2025), itepekimab (mixed phase 3, shelved 2025), astegolimab (missed primary endpoint, shelved 2025) (shelved reports).", "kind": "evidence", "confidence": 0.9, "source_ids": ["shelved:drug:benralizumab", "shelved:drug:itepekimab", "shelved:drug:astegolimab"]}, {"id": "a3-h2-007", "agent": "a3_profile", "text": "Lunsekimig (anti-TSLP/IL-13) and felcorekibart (anti-IL-33) are in Phase 3 for COPD with expected completion ~2029, potentially on market by 2031-2033 (nct:NCT07190209, 2026; nct:NCT07780669, 2026).", "kind": "evidence", "confidence": 0.8, "source_ids": ["nct:NCT07190209", "nct:NCT07780669"]}, {"id": "a3-h2-008", "agent": "a3_profile", "text": "Tozorakimab (anti-IL-33) showed significant exacerbation reduction in Phase 3 OBERON/TITANIA (2026), likely to be approved by launch (pmid:42708515, 2026).", "kind": "evidence", "confidence": 0.85, "source_ids": ["pmid:42708515"]}, {"id": "a3-h2-009", "agent": "a3_profile", "text": "The asset is a follow-on dual PDE3/4 inhibitor, not ensifentrine itself, differentiated by once-daily DPI and combination potential; this is a judgment based on the approved status of ensifentrine and the need for differentiation.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, "inactive": {"hypothesis_id": "h2", "repurposing": [], "shelved": []}, "landscape": {"hypothesis_id": "h2", "programs": [], "orthogonal": [], "crowding_score": 0.3, "catalysts": []}, "verdict": {"hypothesis_id": "h2", "verdict": "survives", "revise_target": null, "risks": [{"text": "The must-have \u226530% reduction in annualized moderate/severe exacerbations vs placebo on top of LAMA/LABA is not supported by any human data. ENHANCE phase 3 trials enrolled patients with FEV1 30-70%, mMRC\u22652, and explicitly excluded those on dual LAMA/LABA or triple therapy (pmid:37364283, 2023; pmid:39106052, 2024). The pooled ENHANCE analysis reported ~44% exacerbation rate reduction vs placebo in that treatment-naive-to-combination population (pmid:39197510, 2024). The only PDE4 add-on with label data, oral roflumilast, reduces exacerbations by only 15-18% in severe chronic bronchitis (fda:NDA022522, 2025; market:drug:roflumilast:2023-01-01). Extrapolating a 30% add-on effect on top of LAMA/LABA is an unvalidated leap.", "kill_criterion": "A phase 2/3 trial of a dual PDE3/4 inhibitor added to LAMA/LABA shows <30% reduction in annualized moderate/severe exacerbations vs placebo, or a pooled analysis of roflumilast add-on data shows effect size <20%.", "cheapest_test": "Query roflumilast phase 3 add-on trials (e.g., M2-124/M2-125) for exacerbation rate reduction on top of LAMA/LABA; or run a 24-week event-driven phase 2a using COPDCompEx composite (as in mitiperstat CRESCENDO, pmid:42562590, 2026) in patients on LAMA/LABA.", "claims": [{"id": "a6-h2-001", "agent": "a6_redteam", "text": "ENHANCE trials enrolled FEV1 30-70%, mMRC\u22652, and excluded patients on dual/triple therapy (2023-2024).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:37364283", "pmid:39106052"]}, {"id": "a6-h2-002", "agent": "a6_redteam", "text": "Pooled ENHANCE analysis reported ~44% exacerbation rate reduction vs placebo in patients not on dual/triple therapy (2024).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:39197510"]}, {"id": "a6-h2-003", "agent": "a6_redteam", "text": "Roflumilast, oral PDE4, reduces exacerbations by ~15-18% in severe chronic bronchitis with GI/weight-loss side effects (2025).", "kind": "evidence", "confidence": 0.9, "source_ids": ["fda:NDA022522", "market:drug:roflumilast:2023-01-01"]}, {"id": "a6-h2-004", "agent": "a6_redteam", "text": "No human data support \u226530% exacerbation reduction on top of LAMA/LABA for dual PDE3/4.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, {"text": "The must-have once-daily DPI with non-inferior trough FEV1 (within 50 mL) to BID nebulized ensifentrine is not supported by any clinical evidence. Ensifentrine is approved as BID nebulized (pmid:41409630, 2025). No PK/PD or formulation data in the pack demonstrate that a once-daily DPI can maintain 24-hour bronchodilation and anti-inflammatory effect. Additionally, DPI performance depends on inspiratory flow; a phase 4 study showed suboptimal peak inspiratory flow (<60 L/min) is common in COPD and affects DPI delivery (NCT04606394, 2023).", "kill_criterion": "Phase 1 PK/PD or a bioequivalence-style study shows once-daily DPI trough FEV1 is >50 mL inferior to BID nebulized ensifentrine, or DPI deposition is inadequate in patients with suboptimal PIF.", "cheapest_test": "Phase 1 single/multiple ascending dose study comparing once-daily DPI vs BID nebulized ensifentrine on FEV1 AUC0-24h and trough FEV1, with PIF measurement in target COPD patients (NCT04606394 design).", "claims": [{"id": "a6-h2-005", "agent": "a6_redteam", "text": "Ensifentrine is approved as BID nebulized therapy (2025).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:41409630"]}, {"id": "a6-h2-006", "agent": "a6_redteam", "text": "DPI performance is affected by suboptimal peak inspiratory flow in COPD (2023).", "kind": "evidence", "confidence": 0.8, "source_ids": ["nct:NCT04606394"]}, {"id": "a6-h2-007", "agent": "a6_redteam", "text": "No evidence that once-daily DPI can match BID nebulized efficacy.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, {"text": "The must-have 'no increase in GI events or weight loss vs placebo' and 'no cardiac safety signal' is challenged by PDE4 class effects. Roflumilast label shows diarrhea 9.5% vs 2.7%, weight decreased 7.5% vs 2.1%, nausea 4.7% vs 1.4%, and psychiatric events 5.9% vs 3.3% (fda:NDA022522#26, #27, #28, #37, 2025). PDE3 inhibition can cause cardiac inotropy with systemic exposure (safety_clues). Inhaled delivery may limit systemic exposure, but the follow-on DPI's systemic PK is unknown.", "kill_criterion": "Phase 1/2 shows systemic exposure leading to PDE3-mediated heart rate/QT changes or PDE4-mediated GI/weight loss exceeding placebo by a clinically meaningful margin.", "cheapest_test": "Phase 1 multiple ascending dose with continuous Holter monitoring, QT assessment, and GI AE/weight tracking; or preclinical PK/PD in a relevant species.", "claims": [{"id": "a6-h2-008", "agent": "a6_redteam", "text": "Roflumilast label reports diarrhea 9.5% vs 2.7%, weight decreased 7.5% vs 2.1%, nausea 4.7% vs 1.4%, psychiatric events 5.9% vs 3.3% (2025).", "kind": "evidence", "confidence": 0.9, "source_ids": ["fda:NDA022522#26", "fda:NDA022522#27", "fda:NDA022522#28", "fda:NDA022522#37"]}, {"id": "a6-h2-009", "agent": "a6_redteam", "text": "PDE3 inhibition carries cardiac inotropy risk if systemic exposure occurs; DPI systemic PK unknown.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, {"text": "Ensifentrine is already approved (2024) (pmid:41409630, 2025). The follow-on must show non-inferiority to ensifentrine on FEV1 and better adherence, but no evidence supports an adherence advantage of once-daily DPI over BID nebulized in COPD. Meanwhile, biologics (dupilumab for eosinophilic COPD, tozorakimab for exacerbation reduction on top of triple therapy) are entering the market (pmid:37272521, 2023; pmid:42708515, 2026). The target population 'on top of LAMA/LABA' may be better served by these biologics, making the PDE3/4 follow-on a marginal improvement.", "kill_criterion": "Market research or real-world data show no incremental adoption vs ensifentrine, or payers require head-to-head superiority over ensifentrine for reimbursement.", "cheapest_test": "Adjudicated payer/prescriber survey or analysis of ensifentrine real-world adherence and discontinuation rates; or a head-to-head phase 3 vs ensifentrine if non-inferiority is the only claim.", "claims": [{"id": "a6-h2-010", "agent": "a6_redteam", "text": "Ensifentrine approved for COPD as BID nebulized (2025).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:41409630"]}, {"id": "a6-h2-011", "agent": "a6_redteam", "text": "Dupilumab and tozorakimab reduce exacerbations in COPD, targeting eosinophilic and broader populations (2023, 2026).", "kind": "evidence", "confidence": 0.9, "source_ids": ["pmid:37272521", "pmid:42708515"]}, {"id": "a6-h2-012", "agent": "a6_redteam", "text": "No evidence of adherence benefit for once-daily DPI over BID nebulized in COPD.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, {"text": "Checklist prior_failures includes icenticaftor (QBW251), a CFTR potentiator that failed phase 2b because of no dose-response for trough FEV1 at week 12 (curated:shelved:icenticaftor-qbw251, 2023; pmid:37411039, 2023). Inhaled PI3K\u03b4 inhibitor CHF6523 also failed to support the target (pmid:39427187, 2024). These failures underscore that FEV1 and exacerbation endpoints in COPD are hard to move, and a follow-on PDE3/4 must show a clear effect size, not just mechanism.", "kill_criterion": "If a phase 2 trial of the follow-on fails to show dose-response on trough FEV1 or exacerbation reduction, mirroring icenticaftor.", "cheapest_test": "Review phase 2b dose-ranging design of icenticaftor and apply lessons to the PDE3/4 program; ensure multiple doses and 24-week endpoint.", "claims": [{"id": "a6-h2-013", "agent": "a6_redteam", "text": "Icenticaftor failed phase 2b with no dose-response for trough FEV1 at week 12 (2023).", "kind": "evidence", "confidence": 0.9, "source_ids": ["curated:shelved:icenticaftor-qbw251", "pmid:37411039"]}, {"id": "a6-h2-014", "agent": "a6_redteam", "text": "CHF6523 PI3K\u03b4 data suggest target not suitable for COPD (2024).", "kind": "evidence", "confidence": 0.8, "source_ids": ["pmid:39427187"]}, {"id": "a6-h2-015", "agent": "a6_redteam", "text": "COPD trials frequently fail on FEV1/exacerbation endpoints; follow-on must demonstrate dose-response.", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}], "premortem": "[revise cap reached (one round); unresolved] It is 3 years later and this program failed. The most likely reason was that the follow-on once-daily DPI dual PDE3/4 inhibitor could not demonstrate a \u226530% exacerbation reduction on top of LAMA/LABA; the effect size was closer to roflumilast's 15-18%, and the once-daily DPI did not achieve non-inferior trough FEV1 to BID nebulized ensifentrine. PDE4-mediated GI and weight-loss side effects eroded adherence, and payers saw no differentiation from the already-approved ensifentrine or from emerging biologics targeting exacerbation reduction."}, "judgment": {"hypothesis_id": "h2", "red_team_is": "right", "decision": "revise", "rulings": [{"risk": "Profile incoherence / no differentiated asset", "holds": true, "severity": "major", "why": "The profile assumes ensifentrine is already on market yet sets minimum specs identical to ensifentrine (BID nebulized, same population) without defining a follow-on molecule or a data-backed differentiation."}, {"risk": "Add-on efficacy on LAMA/LABA or triple therapy unproven", "holds": true, "severity": "major", "why": "ENHANCE excluded dual/triple background therapy, so the must-have >=25% exacerbation reduction and >=60 mL FEV1 on top of standard background is unsupported."}, {"risk": "Trough FEV1 must-have not met by underlying data", "holds": true, "severity": "major", "why": "ENHANCE reported FEV1 AUC0-12h (+87/+94 mL), not trough FEV1; the profile's trough FEV1 must-have is not evidenced and may be unachievable."}, {"risk": "Long-term PDE3/PDE4 safety untested", "holds": true, "severity": "minor", "why": "Short-term ensifentrine data are reassuring (diarrhea 1.0% vs 1.0%), and the cardiac/GI/psychiatric concern is largely extrapolated from oral roflumilast; worth a diligence check but not a current failure."}, {"risk": "Competitive crowding and nebulized BID adherence barrier", "holds": true, "severity": "major", "why": "The profile's minimum spec is BID nebulized with no proven convenience or efficacy advantage over approved ensifentrine, revefenacin, and roflumilast; the QD DPI holy grail is unsupported."}], "reasoning": "The red team is right that the profile is not investable as written: it never defines a differentiated asset, and its must-haves are either identical to an already-approved product or unsupported by the cited ENHANCE data. The add-on efficacy requirement is especially problematic because ENHANCE excluded patients on dual/triple background therapy, and the trough FEV1 threshold is not the endpoint the trials actually reported. These are major but fixable issues: Agent 3 must specify the actual molecule/device, revise the efficacy endpoints to match available data, and either generate add-on evidence or lower the bar. The safety and competitive concerns are secondary and do not rise to fatal mechanistic failure. No attack proves the technology cannot work, so the correct decision is revise rather than kill."}, "revised": true, "failure": null, "checklist": {"retractions": [], "prior_failures": ["curated:shelved:icenticaftor-qbw251"], "single_lab_or_unreplicated": [], "safety": [], "contradictions": []}, "postcheck": [], "refs": [{"id": "pmid:37364283", "by": ["A2 mechanism", "A3 profile", "A6 red team"], "title": "Ensifentrine, a Novel Phosphodiesterase 3 and 4 Inhibitor for the Treatment of Chronic Obstructive Pulmonary Disease: Randomized, Double-Blind, Placebo-controlled, Multicenter Phase III Trials (the ENHANCE Trials).", "date": "2023-06-26", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/37364283/"}, {"id": "pmid:39106052", "by": ["A2 mechanism", "A3 profile", "A6 red team"], "title": "Effect of ensifentrine on dyspnea in patients with moderate-to-severe chronic obstructive pulmonary disease: pooled analysis of the ENHANCE trials.", "date": "2024-08-06", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/39106052/"}, {"id": "pmid:39197510", "by": ["A2 mechanism", "A3 profile", "A6 red team"], "title": "Effect of Dual Phosphodiesterase 3 and 4 Inhibitor Ensifentrine on Exacerbation Rate and Risk in Patients With Moderate to Severe COPD.", "date": "2024-08-27", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/39197510/"}, {"id": "pmid:41409630", "by": ["A3 profile", "A6 red team"], "title": "Advancing COPD management through novel pharmacological agents: ensifentrine and dupilumab.", "date": "2025-12-16", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/41409630/"}, {"id": "fda:NDA022522", "by": ["A3 profile", "A6 red team"], "title": "Daliresp (ROFLUMILAST): FDA label", "date": "2025-05-31", "source": "fda", "url": "https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=c9a1d0a8-581f-4f91-a2b8-f419192d0ebf"}, {"id": "market:drug:roflumilast:2023-01-01", "by": ["A3 profile", "A6 red team"], "title": "roflumilast market stats (2023)", "date": "2025-05-31", "source": "market", "url": null}, {"id": "pmid:37272521", "by": ["A3 profile", "A6 red team"], "title": "Dupilumab for COPD with Type 2 Inflammation Indicated by Eosinophil Counts.", "date": "2023-05-21", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/37272521/"}, {"id": "shelved:drug:benralizumab", "by": ["A3 profile"], "title": "benralizumab shelved (efficacy)", "date": "2025-09-17", "source": "shelved", "url": null}, {"id": "shelved:drug:itepekimab", "by": ["A3 profile"], "title": "itepekimab shelved (efficacy)", "date": "2025-07-09", "source": "shelved", "url": null}, {"id": "shelved:drug:astegolimab", "by": ["A3 profile"], "title": "astegolimab shelved (efficacy)", "date": "2025-07-21", "source": "shelved", "url": null}, {"id": "nct:NCT07190209", "by": ["A3 profile"], "title": "Efficacy, Safety, and Tolerability Study of Lunsekimig Compared With Placebo in Adult Participants With Inadequately Controlled Chronic Obstructive Pulmonary Disease (COPD) Characterized by an Eosinophilic Phenotype", "date": "2026-10-19", "source": "ctgov", "url": "https://clinicaltrials.gov/study/NCT07190209"}, {"id": "nct:NCT07780669", "by": ["A3 profile"], "title": "A Study to Investigate the Efficacy and Safety of GSK5784283 (Felcorekibart) Compared With Placebo in Participants With Moderate to Very Severe COPD (PERSIST COPD-1)", "date": "2026-11-05", "source": "ctgov", "url": "https://clinicaltrials.gov/study/NCT07780669"}, {"id": "pmid:42708515", "by": ["A3 profile", "A6 red team"], "title": "Tozorakimab to Prevent COPD Exacerbations.", "date": "2026-09-08", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/42708515/"}, {"id": "nct:NCT04606394", "by": ["A6 red team"], "title": "Peak Inspiratory Flow and Dry Powder Inhaler Performance in COPD", "date": "2023-05-08", "source": "ctgov", "url": "https://clinicaltrials.gov/study/NCT04606394"}, {"id": "fda:NDA022522#26", "by": ["A6 red team"], "title": "Daliresp label: adverse_reaction \u00b7 diarrhea", "date": "2025-05-31", "source": "label_event", "url": null}, {"id": "fda:NDA022522#27", "by": ["A6 red team"], "title": "Daliresp label: adverse_reaction \u00b7 weight decreased", "date": "2025-05-31", "source": "label_event", "url": null}, {"id": "fda:NDA022522#28", "by": ["A6 red team"], "title": "Daliresp label: adverse_reaction \u00b7 nausea", "date": "2025-05-31", "source": "label_event", "url": null}, {"id": "fda:NDA022522#37", "by": ["A6 red team"], "title": "Daliresp label: warning \u00b7 psychiatric events including suicidality", "date": "2025-05-31", "source": "label_event", "url": null}, {"id": "curated:shelved:icenticaftor-qbw251", "by": ["A6 red team"], "title": "icenticaftor (QBW251): failed or shelved in COPD", "date": "2023-07-06", "source": "curated", "url": "https://pubmed.ncbi.nlm.nih.gov/37411039/"}, {"id": "pmid:37411039", "by": ["A6 red team"], "title": "Icenticaftor, a CFTR Potentiator, in COPD: A Multicenter, Parallel-Group, Double-Blind Clinical Trial.", "date": "2023-07-06", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/37411039/"}, {"id": "pmid:39427187", "by": ["A6 red team"], "title": "CHF6523 data suggest that the phosphoinositide 3-kinase delta isoform is not a suitable target for the management of COPD.", "date": "2024-10-19", "source": "pubmed", "url": "https://pubmed.ncbi.nlm.nih.gov/39427187/"}]}, {"card": {"id": "h3", "mechanism": "TSLP blockade with tezepelumab for exacerbation-prone COPD", "target_ids": ["hgnc:TSLP"], "direction": "inhibit", "evidence_tier": 2, "validation_level": "silver", "modality": "antibody", "tractability": "Tezepelumab is an approved anti-TSLP antibody for severe asthma; phase 2a COURSE in COPD completed.", "safety_clues": ["No specific safety signals in evidence; tezepelumab has a well-characterized safety profile in asthma."], "biggest_uncertainty": "COURSE phase 2a results not yet reported; whether TSLP blockade reduces exacerbations in unselected COPD is unknown.", "rationale_other_conditions": "TSLP is an epithelial alarmin upregulated in COPD; tezepelumab is approved for asthma and reduces exacerbations regardless of eosinophils.", "claims": [{"id": "a2-h3-001", "agent": "a2_mechanism", "text": "COURSE phase 2a trial (2024) evaluated tezepelumab in moderate-to-very-severe COPD on triple therapy; results not yet published (source: pmid:39653044).", "kind": "evidence", "confidence": 0.7, "source_ids": ["pmid:39653044"]}, {"id": "a2-h3-002", "agent": "a2_mechanism", "text": "TSLP is a target with genetic support (genetic score 0.25) and tractability as antibody (source: fx:ot-2020-11).", "kind": "evidence", "confidence": 0.6, "source_ids": ["fx:ot-2020-11"]}]}, "grade": {"tier": 2, "level": "silver", "lines": 3, "genetic": 0.25, "phase_in_disease": 2, "human_docs": 1, "failed_precedent": [], "reject": null, "rank": 2, "pub_count": 129}, "profile": {"hypothesis_id": "h3", "soc_gap_at_launch": "By 2031-2033, standard of care for exacerbation-prone COPD will likely include single-inhaler triple therapy (ICS/LAMA/LABA) as backbone, with dupilumab for patients with blood eosinophils \u2265300 cells/\u03bcL and ensifentrine as nebulized add-on (pmid:41409630). I assume dupilumab and ensifentrine remain approved; tozorakimab may be approved if phase 3 OBERON/TITANIA are positive (pmid:42708515), while lunsekimig and felcorekibart are unlikely to reach market before 2031 given primary completions in 2029 (nct:NCT07190209, nct:NCT07780669). Anti-IL-33 (astegolimab, itepekimab) and anti-IL-5 (benralizumab) programs have failed or been shelved, leaving an unmet need for patients without eosinophilic inflammation or who are ineligible for dupilumab (drug:astegolimab, drug:itepekimab, curated:shelved:benralizumab-in-copd). Tezepelumab, targeting upstream TSLP, could address this gap if it reduces exacerbations irrespective of eosinophils.", "minimum_specs": ["Efficacy: \u226525% reduction in annualized rate of moderate/severe COPD exacerbations vs placebo at 52 weeks when added to triple inhaled therapy in patients with \u22651 moderate/severe exacerbation in the prior year, irrespective of baseline blood eosinophil count.", "Safety: No increase in serious adverse events, pneumonia, or all-cause mortality vs placebo; discontinuations due to adverse events \u22645%.", "Dosing: Subcutaneous injection every 4 weeks.", "Route: Subcutaneous.", "Population: Adults 40-80 years with moderate-to-very-severe COPD, current or former smokers, with history of exacerbations despite optimized triple therapy (ICS/LAMA/LABA), regardless of blood eosinophil count."], "holy_grail_specs": ["Efficacy: \u226540% reduction in annualized moderate/severe exacerbations vs placebo at 52 weeks, with a \u2265100 mL improvement in pre-bronchodilator FEV1 and clinically meaningful improvement in symptoms/quality of life (e.g., SGRQ total score \u22654 units) in all-comers, including those with blood eosinophils <300 cells/\u03bcL.", "Safety: Placebo-like safety with no imbalance in serious infections, pneumonia, or malignancies; no treatment-related deaths.", "Dosing: Subcutaneous every 8 weeks or self-administered prefilled syringe every 4 weeks.", "Route: Subcutaneous, preferably self-administered.", "Population: Broad exacerbation-prone COPD population, including chronic bronchitis phenotype, current smokers, and patients with frequent exacerbations regardless of eosinophil count or type 2 biomarker status."], "must_haves": ["\u226525% reduction in annualized rate of moderate/severe COPD exacerbations vs placebo at 52 weeks on top of triple therapy in patients with prior exacerbations, irrespective of baseline blood eosinophil count.", "Subcutaneous dosing every 4 weeks with no increase in serious adverse events vs placebo (upper 95% CI of SAE rate ratio <1.5)."], "expansion_opportunity": "After first approval in exacerbation-prone COPD irrespective of eosinophils, expand to: (1) COPD with chronic bronchitis phenotype, where TSLP-driven mucus hypersecretion is prominent; (2) prevention of exacerbation-related hospitalization, leveraging TSLP upregulation during exacerbations; (3) asthma-COPD overlap and other type 2-high respiratory diseases, given TSLP is upstream of IL-4/13/5 and tezepelumab is already approved in severe asthma; (4) current smokers with COPD, who are often excluded from eosinophil-targeted biologics, since TSLP is induced by cigarette smoke and pollutants.", "claims": [{"id": "a3-h3-001", "agent": "a3_profile", "text": "COURSE phase 2a trial (2024) evaluated tezepelumab in moderate-to-very-severe COPD on triple therapy; TSLP has increased expression in COPD vs healthy individuals (pmid:39653044).", "kind": "evidence", "confidence": 0.7, "source_ids": ["pmid:39653044"]}, {"id": "a3-h3-002", "agent": "a3_profile", "text": "TSLP is a target with genetic support (genetic score 0.25) and tractability as antibody (fx:ot-2020-11).", "kind": "reasoning", "confidence": 0.5, "source_ids": []}, {"id": "a3-h3-003", "agent": "a3_profile", "text": "Dupilumab is approved for COPD with type 2 inflammation (blood eosinophils \u2265300 cells/\u03bcL) and reduces exacerbations in phase 3 trials BOREAS and NOTUS (pmid:37272521, pmid:38767614, pmid:39481660, pmid:41409630).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:37272521", "pmid:38767614", "pmid:39481660", "pmid:41409630"]}, {"id": "a3-h3-004", "agent": "a3_profile", "text": "Ensifentrine is approved for COPD and reduces exacerbations in phase 3 ENHANCE trials (pmid:37364283, pmid:39197510, pmid:41409630).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:37364283", "pmid:39197510", "pmid:41409630"]}, {"id": "a3-h3-005", "agent": "a3_profile", "text": "Benralizumab failed to meet its primary endpoint in phase 3 RESOLUTE in eosinophilic COPD (curated:shelved:benralizumab-in-copd, nct:NCT04053634).", "kind": "evidence", "confidence": 0.75, "source_ids": ["curated:shelved:benralizumab-in-copd", "nct:NCT04053634"]}, {"id": "a3-h3-006", "agent": "a3_profile", "text": "Astegolimab and itepekimab, anti-IL-33 antibodies, have been shelved after mixed phase 2/3 results in COPD (drug:astegolimab, drug:itepekimab).", "kind": "evidence", "confidence": 0.7, "source_ids": ["drug:astegolimab", "drug:itepekimab"]}, {"id": "a3-h3-007", "agent": "a3_profile", "text": "Tozorakimab, another anti-IL-33 antibody, is in phase 3 OBERON/TITANIA without eosinophil selection (pmid:42708515, pmid:40154559).", "kind": "evidence", "confidence": 0.7, "source_ids": ["pmid:42708515", "pmid:40154559"]}, {"id": "a3-h3-008", "agent": "a3_profile", "text": "Lunsekimig and felcorekibart are in phase 3 trials for COPD with eosinophilic phenotype or general exacerbation-prone COPD, with primary completions in 2029 (nct:NCT07190209, nct:NCT07780669).", "kind": "evidence", "confidence": 0.7, "source_ids": ["nct:NCT07190209", "nct:NCT07780669"]}, {"id": "a3-h3-009", "agent": "a3_profile", "text": "Standard of care includes single-inhaler triple therapy (ICS/LAMA/LABA) and LAMA/LABA combinations, as reflected in FDA labels (fda:NDA209482, fda:NDA203975, fda:NDA206756, fda:NDA021395, fda:NDA210598).", "kind": "evidence", "confidence": 0.75, "source_ids": ["fda:NDA209482", "fda:NDA203975", "fda:NDA206756", "fda:NDA021395", "fda:NDA210598"]}, {"id": "a3-h3-010", "agent": "a3_profile", "text": "Mepolizumab reduced exacerbations in eosinophilic COPD after hospitalization in a phase 2b trial (pmid:40305842).", "kind": "evidence", "confidence": 0.6, "source_ids": ["pmid:40305842"]}, {"id": "a3-h3-011", "agent": "a3_profile", "text": "Tezepelumab is an approved anti-TSLP antibody for severe asthma, supporting subcutaneous dosing and a well-characterized safety profile (reasoning from hypothesis card).", "kind": "reasoning", "confidence": 0.5, "source_ids": []}]}, "inactive": {"hypothesis_id": "h3", "repurposing": [], "shelved": []}, "landscape": {"hypothesis_id": "h3", "programs": [], "orthogonal": [], "crowding_score": 0.3, "catalysts": []}, "verdict": {"hypothesis_id": "h3", "verdict": "revise", "revise_target": "a3_profile", "risks": [{"text": "No human efficacy confirmation for TSLP blockade in COPD; the only phase 2a trial (COURSE) is published but its results are not available in the evidence pack, and the related alarmin/type 2 pathways have failed in phase 3 (astegolimab, itepekimab, benralizumab). The must-have of \u226525% exacerbation reduction in all-comers is therefore speculative and unsupported by any positive human data in COPD.", "kill_criterion": "If COURSE phase 2a shows <25% reduction or no significant reduction in annualized moderate/severe exacerbations, or if tozorakimab phase 3 (OBERON/TITANIA) is negative, the hypothesis is dead.", "cheapest_test": "Obtain and analyze the COURSE phase 2a primary endpoint (annualized moderate/severe exacerbation rate) from pmid:39653044; also monitor tozorakimab OBERON/TITANIA results (pmid:42708515) as a class readout.", "claims": [{"id": "a6-h3-001", "agent": "a6_redteam", "text": "COURSE phase 2a trial of tezepelumab in moderate-to-very-severe COPD on triple therapy was published in 2024, but the evidence pack does not include its efficacy results (pmid:39653044).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:39653044"]}, {"id": "a6-h3-002", "agent": "a6_redteam", "text": "Anti-IL-33 antibodies astegolimab and itepekimab were shelved after phase 3 failures in COPD (2025), and anti-IL-5 benralizumab failed in eosinophilic COPD (2025), indicating that targeting type 2/alarmin pathways without a validated biomarker has not succeeded (drug:astegolimab, drug:itepekimab, curated:shelved:benralizumab-in-copd).", "kind": "evidence", "confidence": 0.75, "source_ids": ["drug:astegolimab", "drug:itepekimab", "curated:shelved:benralizumab-in-copd"]}, {"id": "a6-h3-003", "agent": "a6_redteam", "text": "Tozorakimab, an anti-IL-33 antibody, is in phase 3 OBERON/TITANIA without eosinophil selection (2026), providing a direct competitive and class-level readout for alarmin blockade in COPD (pmid:42708515).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:42708515"]}]}, {"text": "The product profile's 'irrespective of baseline blood eosinophils' claim is contradicted by the only positive biologic in COPD: dupilumab required blood eosinophils \u2265300 cells/\u03bcL to show efficacy, and benralizumab failed even in that enriched population. There is no evidence that TSLP blockade works in low-eosinophil COPD, and the mechanism is upstream of IL-4/13/5, which are type 2 drivers.", "kill_criterion": "If COURSE shows no benefit in the low-eosinophil subgroup (e.g., <300 cells/\u03bcL) or if any post-hoc analysis shows effect only in eosinophilic patients, the all-comers positioning fails.", "cheapest_test": "Request subgroup analysis of COURSE by baseline blood eosinophil count (if available) or design a phase 2b trial enriched for eosinophils \u2265300 cells/\u03bcL to test the mechanism before committing to an all-comers phase 3.", "claims": [{"id": "a6-h3-004", "agent": "a6_redteam", "text": "Dupilumab phase 3 trials BOREAS and NOTUS enrolled only COPD patients with blood eosinophils \u2265300 cells/\u03bcL and showed exacerbation reduction in that population (2023-2024) (pmid:37272521, pmid:38767614).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:37272521", "pmid:38767614"]}, {"id": "a6-h3-005", "agent": "a6_redteam", "text": "Benralizumab, an eosinophil-depleting antibody, failed to significantly reduce exacerbations in a phase 3 trial of COPD patients with eosinophils \u2265300/\u03bcL and \u22652 exacerbations/year (2025) (curated:shelved:benralizumab-in-copd).", "kind": "evidence", "confidence": 0.75, "source_ids": ["curated:shelved:benralizumab-in-copd"]}]}, {"text": "Competitive risk: tozorakimab (anti-IL-33) is in phase 3 with no eosinophil selection and may read out before tezepelumab advances to phase 3. If tozorakimab is positive, it may occupy the alarmin space; if negative, it will cast doubt on the entire alarmin approach, including TSLP. Lunsekimig and felcorekibart are also in phase 3 for eosinophilic or general exacerbation-prone COPD, further crowding the space.", "kill_criterion": "If tozorakimab is approved or shows strong efficacy in all-comers, tezepelumab becomes redundant; if tozorakimab fails, the class rationale is weakened and payers/investors may abandon alarmin targeting.", "cheapest_test": "Track tozorakimab OBERON/TITANIA results (pmid:42708515) and compare trial designs and patient populations; also monitor lunsekimig (nct:NCT07190209) and felcorekibart (nct:NCT07780669) timelines.", "claims": [{"id": "a6-h3-006", "agent": "a6_redteam", "text": "Tozorakimab phase 3 OBERON/TITANIA enrolled COPD patients without eosinophil selection and is expected to report before 2029 (2026) (pmid:42708515).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:42708515"]}, {"id": "a6-h3-007", "agent": "a6_redteam", "text": "Lunsekimig (Sanofi) and felcorekibart (GSK) are in phase 3 for COPD with primary completions in 2029 (2026) (nct:NCT07190209, nct:NCT07780669).", "kind": "evidence", "confidence": 0.75, "source_ids": ["nct:NCT07190209", "nct:NCT07780669"]}]}, {"text": "The must-have efficacy bar (\u226525% reduction at 52 weeks on top of triple therapy) may be unachievable in an all-comers population. Dupilumab, the only positive biologic, achieved ~30% reduction but only in eosinophil-enriched patients; in unselected COPD, the effect size is likely smaller. The phase 2a COURSE trial may have used a shorter or different endpoint, and no data support a 25% effect in low-eosinophil patients.", "kill_criterion": "If COURSE shows an effect size <25% in the overall population or in the low-eosinophil subgroup, the must-have is not met and the product profile is unrealistic.", "cheapest_test": "Extract the effect size and confidence intervals from COURSE (pmid:39653044) and compare with dupilumab BOREAS/NOTUS effect sizes (pmid:37272521, pmid:38767614) to model realistic expectations.", "claims": [{"id": "a6-h3-008", "agent": "a6_redteam", "text": "Dupilumab reduced exacerbations by approximately 30% in COPD patients with eosinophils \u2265300 cells/\u03bcL in BOREAS and NOTUS (2023-2024) (pmid:37272521, pmid:38767614).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:37272521", "pmid:38767614"]}, {"id": "a6-h3-009", "agent": "a6_redteam", "text": "COURSE phase 2a evaluated tezepelumab in moderate-to-very-severe COPD on triple therapy, but the evidence pack does not include its efficacy results (2024) (pmid:39653044).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:39653044"]}]}], "premortem": "It is 3 years later and this program failed. The most likely reason was that tezepelumab failed to reduce exacerbations in unselected COPD patients in phase 3, consistent with the failures of anti-IL-33 (astegolimab, itepekimab) and anti-IL-5 (benralizumab) biologics, and the only successful biologic (dupilumab) required eosinophil enrichment. The all-comers positioning without a biomarker proved untenable, and the competitive readout from tozorakimab either occupied the space or further discredited the alarmin approach."}, "judgment": {"hypothesis_id": "h3", "red_team_is": "right", "decision": "revise", "rulings": [{"risk": "No human efficacy confirmation for TSLP blockade in COPD", "holds": true, "severity": "major", "why": "The profile cites COURSE but does not provide its efficacy results; the must-have of \u226525% reduction in all-comers is unsupported by positive human data, and related alarmin/type 2 failures are cited."}, {"risk": "All-comers positioning contradicted by eosinophil-dependent efficacy", "holds": true, "severity": "major", "why": "Dupilumab required eosinophils \u2265300 and benralizu d:40154559"]}, {"id": "a3-h5-003", "agent": "a3_profile", "text": "Phase 1 (2023) showed tozorakimab well tolerated in healthy adults and COPD patients; no specific safety signals.", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:38115209"]}, {"id": "a3-h5-004", "agent": "a3_profile", "text": "PK/TE modelling (2024) evaluated tozorakimab dose frequencies every 2, 4, or 6 weeks at doses 30-600 mg SC.", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:39183511"]}, {"id": "a3-h5-005", "agent": "a3_profile", "text": "Itepekimab (anti-IL-33) had mixed phase 3 results (AERIFY-1 met, AERIFY-2 missed) and astegolimab (anti-ST2) missed ARNASA, indicating pathway challenges but not negating tozorakimab's positive phase 3.", "kind": "evidence", "confidence": 0.75, "source_ids": ["shelved:drug:itepekimab", "shelved:drug:astegolimab", "curated:shelved:itepekimab", "curated:shelved:astegolimab"]}, {"id": "a3-h5-006", "agent": "a3_profile", "text": "Dupilumab and ensifentrine are recently approved therapies for COPD (2025 review), with dupilumab for eosinophilic phenotype.", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:41409630"]}, {"id": "a3-h5-007", "agent": "a3_profile", "text": "Lunsekimig is in phase 3 for eosinophilic COPD (2026) and felcorekibart is in phase 3 for moderate-to-very severe COPD (2026); neither addresses non-eosinophilic former-smoker exacerbation risk.", "kind": "evidence", "confidence": 0.7, "source_ids": ["nct:NCT07190209", "nct:NCT07780669"]}, {"id": "a3-h5-008", "agent": "a3_profile", "text": "QX007N, a humanized anti-IL-33 antibody, shows neutralizing activity and is being developed for asthma and COPD (2026).", "kind": "evidence", "confidence": 0.7, "source_ids": ["pmid:42759520"]}, {"id": "a3-h5-009", "agent": "a3_profile", "text": "IL-33 is an epithelial alarmin upregulated in lung tissue of COPD patients (2023).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:38115209"]}, {"id": "a3-h5-010", "a clear mechanistic differentiation. The prior failures are a strong prior that IL-33 neutralization does not translate into robust exacerbation benefit in COPD.", "kill_criterion": "If tozorakimab's phase 3 results are not independently replicated or if the effect size in the overall population is <25% (rate ratio >0.75), the hypothesis fails because the pathway has already shown marginal or negative results in two other phase 3 programs.", "cheapest_test": "Obtain the full OBERON and TITANIA datasets (e.g., from clinicaltrials.gov or the publication appendix) and compute the 95% confidence intervals for the rate ratios in the overall population and in former smokers. Compare these to the AERIFY-2 and ARNASA results to assess whether the effect is plausibly different from prior failures.", "claims": [{"id": "a6-h5-001", "agent": "a6_redteam", "text": "Itepekimab (anti-IL-33) missed its phase 3 primary endpoint in AERIFY-2 with exacerbation reductions of 2% (every 2 weeks) and 12% (every 4 weeks) at week 52 (2025).", "kind": "evidence", "confidence": 0.75, "source_ids": ["curated:shelved:itepekimab"]}, {"id": "a6-h5-002", "agent": "a6_redteam", "text": "Astegolimab (anti-ST2) missed its phase 3 primary endpoint in ARNASA with a 14.5% numerical reduction in annualized exacerbations (2025).", "kind": "evidence", "confidence": 0.75, "source_ids": ["curated:shelved:astegolimab"]}, {"id": "a6-h5-003", "agent": "a6_redteam", "text": "Benralizumab (anti-IL-5R) also missed its phase 3 RESOLUTE primary endpoint in eosinophilic COPD (2025), further raising the bar for biologic efficacy in exacerbation reduction.", "kind": "evidence", "confidence": 0.75, "source_ids": ["curated:shelved:benralizumab-in-copd"]}]}, {"text": "The phase 3 results for tozorakimab are not verifiable from the evidence pack. The only source (pmid:42708515, 2026) provides the trial design but no efficacy numbers in the available abstract. The product profile's must-haves (\u226525% reduction) rest entirely on Agent 3's claim of rate ratios 0.71 and 0.66, which are not independently confirmed in the evidence. Without access to the actual results, the hypothesis is based on unverified data, and the prior pathway failures make it more likely that the claimed effect is either a false positive or a subgroup artifact.", "kill_criterion": "If the full OBERON/TITANIA results show a rate ratio >0.75 in the overall population or if the former-smoker subgroup was not pre-specified as the primary analysis, the must-have efficacy threshold is not met.", "cheapest_test": "Request the full statistical analysis plan and primary results from the OBERON/TITANIA publications or clinical trial registries; verify whether the former-smoker analysis was pre-specified and whether the overall population met the 25% threshold.", "claims": [{"id": "a6-h5-004", "agent": "a6_redteam", "text": "The evidence pack abstract for pmid:42708515 (2026) describes the OBERON and TITANIA trial designs but does not report any efficacy results, including rate ratios or p-values.", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:42708515"]}]}, {"text": "The phase 2a FRONTIER-4 trial used change in pre-bronchodilator FEV1 at week 12 as the primary endpoint, not exacerbations. There is no phase 2 evidence that tozorakimab reduces exacerbations; the only exacerbation data come from the phase 3 trials, which are not fully disclosed. This is a translation risk: a positive FEV1 signal does not guarantee exacerbation benefit, and the prior IL-33 agents showed no consistent FEV1 or exacerbation improvement.", "kill_criterion": "If the phase 3 exacerbation benefit is not accompanied by a meaningful FEV1 improvement, or if the phase 2 FEV1 result was negative, the mechanism's clinical relevance is questionable.", "cheapest_test": "Extract the FRONTIER-4 FEV1 results from the publication (pmid:40154559) and correlate with the phase 3 exacerbation outcomes; if FEV1 did not improve, the exacerbation claim is less credible.", "claims": [{"id": "a6-h5-005", "agent": "a6_redteam", "text": "FRONTIER-4 (2025) was a phase 2a trial with primary endpoint of change in pre-bronchodilator FEV1 at week 12, not exacerbations.", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:40154559"]}]}, {"text": "Even if tozorakimab is positive, the competitive landscape is not empty. QX007N, another anti-IL-33 antibody, is in development for asthma and COPD (2026), and lunsekimig (phase 3, eosinophilic COPD) and felcorekibart (phase 3, moderate-to-very severe COPD) are recruiting. While these target different phenotypes, they could narrow the commercial opportunity or force differentiation. More importantly, the prior failures of itepekimab and astegolimab may lead regulators to demand additional confirmatory trials, delaying launch beyond 2032.", "kill_criterion": "If a competitor (e.g., QX007N) reads out positive phase 3 data before tozorakimab's regulatory approval, or if regulators require a third phase 3 trial due to the pathway's mixed history, the commercial case weakens.", "cheapest_test": "Monitor clinical trial registries for QX007N phase 2/3 initiation and completion dates; assess whether tozorakimab's launch timeline is threatened.", "claims": [{"id": "a6-h5-006", "agent": "a6_redteam", "text": "QX007N is a humanized anti-IL-33 antibody with neutralizing activity being developed for asthma and COPD (2026).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:42759520"]}, {"id": "a6-h5-007", "agent": "a6_redteam", "text": "Lunsekimig is in a phase 3 trial for eosinophilic COPD (2026) with primary endpoint of annualized moderate-to-severe exacerbations.", "kind": "evidence", "confidence": 0.75, "source_ids": ["nct:NCT07190209"]}, {"id": "a6-h5-008", "agent": "a6_redteam", "text": "Felcorekibart (GSK5784283) is in a phase 3 trial for moderate-to-very severe COPD (2026) with primary endpoint of annualized moderate or severe exacerbations.", "kind": "evidence", "confidence": 0.75, "source_ids": ["nct:NCT07780669"]}]}, {"text": "The product profile's safety must-have (no increase in serious adverse events, upper bound of 95% CI for difference \u22645%) is not supported by any disclosed data. The phase 1 study (2023) reported tolerability in healthy adults and COPD patients, but no long-term safety data from the phase 3 trials are available in the evidence pack. Given the prior IL-33 agents had acceptable safety, this is not the primary killer, but it remains an unverified requirement.", "kill_criterion": "If the phase 3 safety data show an increase in serious adverse events or a new safety signal (e.g., infections), the product profile fails.", "cheapest_test": "Review the safety appendix of the OBERON/TITANIA publications or the FDA/EMA review documents for serious adverse event rates.", "claims": [{"id": "a6-h5-009", "agent": "a6_redteam", "text": "Phase 1 tozorakimab was well tolerated in healthy adults and COPD patients, but no long-term safety data from phase 3 are provided in the evidence pack (2023).", "kind": "evidence", "confidence": 0.75, "source_ids": ["pmid:38115209"]}]}], "premortem": "[revise cap reached (one round); unresolved] It is 3 years later and this program failed. The most likely reason was that the IL-33 pathway does not provide clinically meaningful exacerbation reduction in COPD, as evidenced by the prior phase 3 failures of itepekimab and astegolimab; tozorakimab's positive results were either not replicated or the effect size was below the 25% threshold in the broader population, and the former-smoker subgroup analysis did not hold up under regulatory scrutiny."}, "judgment": {"hypothesis_id": "h5", "red_team_is": "right", "decision": "revise", "rulings": [{"risk": "The product profile's central claims are stale and contradicted by the evidence", "holds": true, "severity": "minor", "why": "The profile says OBERON/TITANIA results are not disclosed, but the red team cites the same source showing positive phase 3 results. This is a documentation contradiction, not a product threat; it actually supports efficacy."}, {"risk": "FRONTIER-4 missed FEV1 and showed a safety signal", "holds": true, "severity": "major", "why": "The profile does not address the FEV1 miss or the higher TEAEs of special interest. Phase 3 exacerbation success mitigates but does not eliminate the need to explain lung-function and safety signals; the profile must be updated with phase 3 safety data."}, {"risk": "Competitive pressure from felcorekibart and lunsekimig", "holds": true, "severity": "minor", "why": "The profile acknowledges these competitors but does not articulate differentiation beyond mechanism. This is a commercial diligence point, not fatal given tozorakimab's positive phase 3 data."}, {"risk": "Must-have of \u226520% reduction on triple therapy may not be met", "holds": true, "severity": "major", "why": "The phase 3 trials allowed stable standard-of-care inhaled therapy, not necessarily triple therapy. The profile's must-have specifies triple therapy, so a subgroup analysis is required to confirm the must-have is met; this is a spec mismatch that needs resolution."}], "reasoning": "The red team is right because two major risks hold: the FRONTIER-4 FEV1 miss and TEAE imbalance need explanation, and the triple-therapy subgroup uncertainty directly challenges a must-have. The profile is also stale because it claims phase 3 results are undisclosed when the cited source reports positive OBERON/TITANIA results. These are not fatal\u2014the phase 3 exacerbation data appear strong\u2014but they require updating the profile with the latest data and confirming the triple-therapy subgroup. Competitive pressure is a minor commercial concern. Therefore the hypothesis should be revised, not killed or advanced as written."}, "revised": true, "failure": null, "checklist": {"retractions": [], "prior_failures": ["curated:shelved:itepekimab", "curated:shelved:benralizumab-in-copd"], "single_lab_ lready-approved product or unsupported by the cited ENHANCE data. The add-on efficacy requirement is especially problematic because ENHANCE exc"}, {"actor": "red_teamer", "action": "revise", "target": "a3_profile:h2", "reason": "The product profile is incoherent: it describes ensifentrine as the product but also assumes ensifentrine will already be on the market at launch (~2031-2033). If the asset is ensifentrine, it is already approved and marketed, so there is no venture opportunity. If the asset is a follow-on dual PDE3/4 inhibitor, the profile does not specify the molecule, device, or differentiation (e.g., DPI, QD, fixed-dose combination, superior efficacy/safety). The must-haves (BID nebulized, same population) are identical to the approved product, so there is no reason for payers or prescribers to switch. Agent 3 must redo the profile to define the actual asset and its differentiation."}, {"actor": "judge", "action": "revise", "target": "h2", "reason": "red team right: The red team is right that the profile is not investable as written: it never defines a differentiated asset, and its must-haves are either identical to an already-approved product or unsupported by the cited ENHANCE data. The add-on efficacy requirement is especially problematic because ENHANCE exc"}, {"actor": "orchestrator", "action": "override", "target": "a6_redteam:h2", "reason": "revise cap reached (one round): The must-have \u226530% reduction in annualized moderate/severe exacerbations vs placebo on top of LAMA/LABA is not supported by any human data. ENHANCE phase 3 trials enrolled patients with FEV1 30-70%, mMRC\u22652, and explicitly excluded those on dual LAMA/LABA or triple therapy (pmid:37364283, 2023; pmid:39106052, 2024). The pooled ENHANCE analysis reported ~44% exacerbation rate reduction vs placebo in that treatment-naive-to-combination population (pmid:39197510, 2024). The only PDE4 add-on with label data, oral roflumilast, reduces exacerbations by only 15-18% in severe c <script>

// ---- derived
const cards = D.cards.slice().sort((a,b) => (a.grade?.rank ?? 9) - (b.grade?.rank ?? 9));

// ---- overview

function gantt(){

    D.segs.filter(s => s.agent===a && (s.hid||'')===h).forEach(s => {

      g += `<rect x="${x(s.s)}" y="${y+3}" width="${w}" height="${rh-6}" rx="2" fill="${color[a]}"><title>${AG[a]} ${h} · ${Math.round(s.s)}s → ${Math.round(s.e)}s (${Math.round(s.e-s.s)}s)</title></rect>`;
    });
    y += rh;
  });
  // markers
  const fail = cards.find(c=>c.failure);
  const loopT = Math.min(...D.segs.filter(s=>s.agent==='a6b_judge').map(s=>s.e));
  g += `<line x1="${x(loopT)}" x2="${x(loopT)}" y1="${top-10}" y2="${Hh-22}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${x(loopT)+4}" y="${top-12}" style="fill:var(--warn)">judge → revise loop</text>`;
  if (fail){ const fs = Math.max(...D.segs.filter(s=>s.hid===fail.card.id).map(s=>s.e));
    g += `<text x="${x(fs)-4}" y="${top-12}" text-anchor="end" style="fill:var(--bad)">${esc(fail.card.id)} fails ✕</text><line x1="${x(fs)}" x2="${x(fs)}" y1="${top-8}" y2="${Hh-22}" stroke="var(--bad)" stroke-dasharray="2 3"/>`; }
  return `<svg viewBox="0 -14 ${W} ${Hh+14}" width="100%" style="min-width:720px" role="img" aria-label="Timeline of agent activity per hypothesis">${g}</svg>`;
}

// ---- tokens & time
function hbars(items, fields, colors, fmtv){
  const W = 520, L = 132, rh = 30, max = Math.max(...items.map(i => fields.reduce((s,f)=>s+i[f],0)));
  let g = '';
  items.forEach((it,i) => { let x0 = L; const y = i*rh;
    g += `<text class="lbl" x="${L-10}" y="${y+18}" text-anchor="end">${esc(it.label)}</text>`;
    fields.forEach((f,j) => { const w = (it[f]/max)*(W-L-70); g += `<rect x="${x0}" y="${y+6}" width="${Math.max(w,1)}" height="17" rx="2" fill="${colors[j]}"><title>${esc(it.label)} ${f}: ${fmt(it[f])}</title></rect>`; x0 += w; });
    g += `<text x="${x0+6}" y="${y+18}">${fmtv(it)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${items.length*rh+4}" width="100%" role="img">${g}</svg>`;
}
const uItems = U.map(([a,u]) => ({label:AG[a], in_:u.input_tokens-u.cached_tokens, cached:u.cached_tokens, out:u.output_tokens, calls:u.calls, lat:u.latency_ms/1000}));

function path(c){
  const steps = ['A3','A4','A5','A6','Judge: revise'];
  let p = steps.map(s=>`<span class="s">${s}</span>`).join('<span class="a">→</span>');
  if (c.failure) p += `<span class="a">↩</span><span class="s loop">A3 rewrite</span><span class="a">→</span><span class="s end-bad">empty output ×2 · failed</span>`;
  else if (c.revised) p += `<span class="a">↩</span><span class="s loop">A3 rewrite</span><span class="a">→</span><span class="s loop">A4</span><span class="a">→</span><span class="s loop">A5</span><span class="a">→</span><span class="s loop">A6</span><span class="a">→</span><span class="s end-ok">cap reached · survives</span>`;
  return `<div class="path">${p}</div>`;
}

    <div class="meta"><span>${esc(C.direction)} <b>${C.target_ids.map(x=>esc(x.replace('hgnc:',''))).join(', ')}</b></span><span>modality <b>${esc(C.modality)}</b></span><span>evidence <b>tier ${C.evidence_tier} · ${esc(C.validation_level)}</b></span></div>

  </div>

    </tbody></table></div>
  </div>
  </div></article>`;
}
