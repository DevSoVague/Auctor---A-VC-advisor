services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5433:5432"  # 5433 on the host so a local Postgres on 5432 doesn't clash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
